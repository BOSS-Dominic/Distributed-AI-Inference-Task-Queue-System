# Prometheus configuration — scrapes infrastructure and business metrics.
# Targets resolve on the default compose network by container name.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Business metrics (QPS, latency, failure, queue depth) from the gateway.
  - job_name: gateway
    static_configs:
      - targets: ["fastapi-gateway:8000"]

  # Container CPU / memory / network per container.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Redis queue lengths (queue:heavy / light / delayed / dead).
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # GPU utilisation, memory and temperature.
  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]
