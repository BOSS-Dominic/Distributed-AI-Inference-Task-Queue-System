# Host firewall: allow SSH, HTTP and HTTPS; deny everything else.
# Rules are added BEFORE enabling UFW so an SSH session is never locked out.
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH (optionally restricted to a source IP/CIDR)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ ssh_allowed_from | default('any') }}"

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Default policy — deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default policy — allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable the firewall
  community.general.ufw:
    state: enabled
