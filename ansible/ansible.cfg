[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
# The community.general "yaml" stdout callback was removed in v12; use the
# default callback with YAML output instead.
callback_result_format = yaml
interpreter_python = auto_silent
# Roles live next to this config (ansible/roles), not in the default
# ~/.ansible/roles — required for `playbooks/deploy.yml` to resolve them.
roles_path = roles

[ssh_connection]
pipelining = True
