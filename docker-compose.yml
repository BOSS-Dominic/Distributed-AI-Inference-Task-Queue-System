# Distributed AI Inference Task Queue — Docker Compose
# 7 services: Redis + FastAPI + GPU Worker + 2× CPU Worker
# + Workload Generator + Streamlit Dashboard

services:
  #  Redis (message broker + state cache) 
  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  #  FastAPI (stateless REST gateway) 
  fastapi-gateway:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fastapi-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage          # sole mount: I/O
    environment:
      - REDIS_HOST=redis-broker
    depends_on:
      redis-broker:
        condition: service_healthy
    restart: unless-stopped

  #  GPU Worker (RTX 5070 Ti) 
  worker-fast-gpu:
    build:
      context: ./workers
      dockerfile: Dockerfile.fast
    container_name: worker-fast-gpu
    environment:
      - WORKER_TYPE=FAST
      - WORKER_NAME=worker-fast-gpu
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
    volumes:
      - ./storage:/app/storage          # sole mount
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  CPU Worker 1 (1 core) 
  worker-slow-cpu-1:
    build:
      context: ./workers
      dockerfile: Dockerfile.slow
    container_name: worker-slow-cpu-1
    environment:
      - WORKER_TYPE=SLOW
      - WORKER_NAME=worker-slow-cpu-1
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  CPU Worker 2 (1 core) 
  worker-slow-cpu-2:
    build:
      context: ./workers
      dockerfile: Dockerfile.slow
    container_name: worker-slow-cpu-2
    environment:
      - WORKER_TYPE=SLOW
      - WORKER_NAME=worker-slow-cpu-2
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  Workload Generator (Poisson arrival, 0.5 core) 
  workload-generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: workload-generator
    volumes:
      - ./storage:/app/storage:rw       # read seeds + write output images
    environment:
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - SEED_IMAGES_DIR=/app/storage/inputs/seeds
      - PROMPTS_FILE=/app/storage/inputs/prompts.txt
    deploy:
      resources:
        limits:
          cpus: '0.5'
    depends_on:
      fastapi-gateway:
        condition: service_started
    # not auto-started — triggered by Dashboard via docker exec
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  #  Streamlit Dashboard (monitor + upload + audit) 
  streamlit-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: streamlit-dashboard
    ports:
      - "9501:8501"
    volumes:
      - ./storage:/app/storage          # read-only SQLite + file uploads
      - /var/run/docker.sock:/var/run/docker.sock  # for docker exec
    environment:
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
    deploy:
      resources:
        limits:
          cpus: '0.5'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped
