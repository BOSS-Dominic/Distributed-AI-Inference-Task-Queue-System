# Distributed AI Inference Task Queue — Docker Compose
# 9 services: Redis + FastAPI + GPU Worker + 2× CPU General Worker
# + SIM Specialist + SUM Specialist + Workload Generator + Streamlit Dashboard

services:
  #  Redis (message broker + state cache) 
  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  #  FastAPI (stateless REST gateway) 
  fastapi-gateway:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fastapi-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage          # sole mount: I/O
      - ./logs:/app/logs                # JSON logs consumed by Filebeat (ELK profile)
    environment:
      - REDIS_HOST=redis-broker
    depends_on:
      redis-broker:
        condition: service_healthy
    restart: unless-stopped

  #  GPU Worker (RTX 5070 Ti, all 4 models)
  worker-fast-gpu:
    build:
      context: .
      dockerfile: workers/Dockerfile.fast
    container_name: worker-fast-gpu
    environment:
      - WORKER_TYPE=FAST
      - WORKER_NAME=worker-fast-gpu
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TASK_FAILURE_RATE=0
      - MAX_RETRIES=3
      - RETRY_BASE_DELAY=2.0
      - RETRY_MODE=backoff_jitter
    volumes:
      - ./storage:/app/storage          # sole mount
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  CPU General Worker 1 (SBERT + t5 + DistilBERT, 1 core)
  worker-slow-cpu-1:
    build:
      context: .
      dockerfile: workers/Dockerfile.slow
    container_name: worker-slow-cpu-1
    environment:
      - WORKER_TYPE=SLOW
      - WORKER_NAME=worker-slow-cpu-1
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TASK_FAILURE_RATE=0
      - MAX_RETRIES=3
      - RETRY_BASE_DELAY=2.0
      - RETRY_MODE=backoff_jitter
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  CPU General Worker 2 (SBERT + t5 + DistilBERT, 1 core)
  worker-slow-cpu-2:
    build:
      context: .
      dockerfile: workers/Dockerfile.slow
    container_name: worker-slow-cpu-2
    environment:
      - WORKER_TYPE=SLOW
      - WORKER_NAME=worker-slow-cpu-2
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TASK_FAILURE_RATE=0
      - MAX_RETRIES=3
      - RETRY_BASE_DELAY=2.0
      - RETRY_MODE=backoff_jitter
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  SIM Specialist (SBERT only, ~80MB)
  worker-sim-specialist:
    build:
      context: .
      dockerfile: workers/Dockerfile.slow-sim
    container_name: worker-sim-specialist
    environment:
      - WORKER_TYPE=SIM_SPECIALIST
      - WORKER_NAME=worker-sim-specialist
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TASK_FAILURE_RATE=0
      - MAX_RETRIES=3
      - RETRY_BASE_DELAY=2.0
      - RETRY_MODE=backoff_jitter
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  SUM Specialist (t5-small only, ~240MB)
  worker-sum-specialist:
    build:
      context: .
      dockerfile: workers/Dockerfile.slow-sum
    container_name: worker-sum-specialist
    environment:
      - WORKER_TYPE=SUM_SPECIALIST
      - WORKER_NAME=worker-sum-specialist
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TASK_FAILURE_RATE=0
      - MAX_RETRIES=3
      - RETRY_BASE_DELAY=2.0
      - RETRY_MODE=backoff_jitter
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  Workload Generator (Poisson arrival, 0.5 core)
  workload-generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: workload-generator
    volumes:
      - ./storage:/app/storage:rw       # read seeds + write output images
    environment:
      - API_GATEWAY_URL=http://fastapi-gateway:8000
      - SEED_IMAGES_DIR=/app/storage/inputs/seeds
      - PROMPTS_FILE=/app/storage/inputs/prompts.txt
    deploy:
      resources:
        limits:
          cpus: '0.5'
    depends_on:
      fastapi-gateway:
        condition: service_started
    # not auto-started — triggered by Dashboard via docker exec
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  #  Streamlit Dashboard (monitor + upload + audit) 
  streamlit-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: streamlit-dashboard
    ports:
      - "9501:8501"
    volumes:
      - ./storage:/app/storage          # read-only SQLite + file uploads
      - /var/run/docker.sock:/var/run/docker.sock  # for docker exec
    environment:
      - REDIS_HOST=redis-broker
      - API_GATEWAY_URL=http://fastapi-gateway:8000
    deploy:
      resources:
        limits:
          cpus: '0.5'
    depends_on:
      redis-broker:
        condition: service_healthy
      fastapi-gateway:
        condition: service_started
    restart: unless-stopped

  #  Observability stack (post-thesis): infrastructure + business metrics 
  #  Image references are overridable via env vars (see .env.example), e.g. to
  #  point at a registry mirror on a restricted network.
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:latest}
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      redis-broker:
        condition: service_healthy

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:latest}
    container_name: redis-exporter
    command: ["--redis.addr=redis://redis-broker:6379", "--check-keys=queue:*"]
    ports:
      - "9121:9121"
    restart: unless-stopped
    depends_on:
      redis-broker:
        condition: service_healthy

  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE:-nvidia/dcgm-exporter:4.6.1-4.8.4}
    container_name: dcgm-exporter
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "9400:9400"
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    depends_on:
      - cadvisor
      - redis-exporter
      - fastapi-gateway

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

  #  Logs (optional, local demo): Filebeat -> Elasticsearch -> Kibana 
  #  Start with: docker compose --profile logs up -d
  #  Disabled by default: memory-heavy (~2.4 GB) and not needed on the
  #  CPU-only cloud demo (2 vCPU / 8 GB).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    container_name: elasticsearch
    profiles: ["logs"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.24
    container_name: kibana
    profiles: ["logs"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.24
    container_name: filebeat
    profiles: ["logs"]
    user: root
    # On Windows the bind-mounted config is world-writable, which Filebeat
    # refuses to load by default; --strict.perms=false keeps it working.
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./logs:/logs:ro
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  es_data:
